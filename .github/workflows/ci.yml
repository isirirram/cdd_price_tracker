
name: CI/CD - Smart Price Tracker

# CI runs on every push and pull request to main.
# CD (publishing Docker images to GHCR) runs only after ALL CI jobs pass,
# and only for pushes to main, never for pull requests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-and-scraper-tests:
    name: Backend, Scraper and Worker Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install scraper and worker dependencies
        run: |
          pip install -r scraper/requirements.txt
          pip install -r worker/requirements.txt mongomock

      - name: Run backend tests
        run: python -m pytest backend/tests -v

      - name: Run scraper tests
        run: python -m pytest scraper/tests -v

      # Catches things like a missing import that would crash the worker
      - name: Run worker tests
        run: python -m pytest worker/tests -v

  frontend-check:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-and-scraper-tests, frontend-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-and-scraper-tests, frontend-check, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-price-tracker-backend:latest
            ghcr.io/${{ github.repository_owner }}/smart-price-tracker-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-price-tracker-frontend:latest
            ghcr.io/${{ github.repository_owner }}/smart-price-tracker-frontend:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smart-price-tracker-worker:latest
            ghcr.io/${{ github.repository_owner }}/smart-price-tracker-worker:${{ github.sha }}
